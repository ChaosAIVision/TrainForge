model:
  model_name_or_path: "Qwen/Qwen2-VL-7B-Instruct"
  max_seq_length: 2048
  dtype: null
  load_in_4bit: true
  load_in_8bit: false
  trust_remote_code: true
  device_map: null

hyperparams:
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 8
  warmup_steps: 100
  num_train_epochs: 2
  max_steps: null
  learning_rate: 0.0001
  weight_decay: 0.0
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.05
  logging_steps: 10
  save_steps: 200
  eval_steps: 200
  save_total_limit: 3
  metric_for_best_model: "eval_loss"
  optim: "adamw_8bit"
  seed: 3407
  fp16: false
  bf16: true
  dataloader_num_workers: 2
  remove_unused_columns: false
  report_to: "wandb"
  output_dir: "output_unsloth_vlm_sft"

layer:
  finetune_vision_layers: true
  finetune_language_layers: true
  finetune_attention_modules: true
  finetune_mlp_modules: true
  full_finetuning: false

dataset:
  dataset_name: "ChaosAiVision/image-traffic-law-qa"
  dataset_split: "train"
  test_size: 0.05
  shuffle: true
  seed: 42
  text_field: "text"
  dataset_num_proc: 4
  packing: false

lora:
  r: 16
  lora_alpha: 16
  lora_dropout: 0.0
  bias: "none"
  random_state: 3407
  use_rslora: false
  loftq_config: null
  target_modules: "all-linear"